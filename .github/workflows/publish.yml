name: Publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        env:
          AIPLA_LEGACY_RETIREMENT: ${{ vars.AIPLA_LEGACY_RETIREMENT }}
        run: |
          if [ "${AIPLA_LEGACY_RETIREMENT}" = "enabled" ]; then
            bash retirement/build-redirect-site.sh
          else
            quarto render
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.AIPLA_LEGACY_RETIREMENT == 'enabled' && '_redirect_site' || '_site' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
