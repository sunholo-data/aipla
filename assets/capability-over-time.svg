<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" role="img" aria-label="Illustrative plot of AI capability over time across three model tiers">

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">
    AI capability on a representative benchmark — illustrative
  </text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#666">
    Schematic. Live data from MMLU · GPQA · MMMU · MATH · Open LLM Leaderboard · Epoch AI · Artificial Analysis · AILANG benchmarks.
  </text>

  <!-- Plot area axes -->
  <line x1="80" y1="420" x2="650" y2="420" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="70" x2="80" y2="420" stroke="#333" stroke-width="1.5"/>

  <!-- Y-axis gridlines (light) -->
  <line x1="80" y1="350" x2="650" y2="350" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="280" x2="650" y2="280" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="210" x2="650" y2="210" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="140" x2="650" y2="140" stroke="#eee" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="72" y="425" text-anchor="end" font-size="11" fill="#666">0</text>
  <text x="72" y="354" text-anchor="end" font-size="11" fill="#666">20</text>
  <text x="72" y="284" text-anchor="end" font-size="11" fill="#666">40</text>
  <text x="72" y="214" text-anchor="end" font-size="11" fill="#666">60</text>
  <text x="72" y="144" text-anchor="end" font-size="11" fill="#666">80</text>
  <text x="72" y="74" text-anchor="end" font-size="11" fill="#666">100</text>
  <text x="32" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="600" transform="rotate(-90 32 245)">
    Benchmark score (%)
  </text>

  <!-- X-axis labels -->
  <text x="80" y="440" text-anchor="middle" font-size="11" fill="#666">2023</text>
  <text x="222" y="440" text-anchor="middle" font-size="11" fill="#666">2024</text>
  <text x="365" y="440" text-anchor="middle" font-size="11" fill="#666">2025</text>
  <text x="507" y="440" text-anchor="middle" font-size="11" fill="#666">2026</text>
  <text x="650" y="440" text-anchor="middle" font-size="11" fill="#666">2027 (proj.)</text>

  <!-- "Now" marker -->
  <line x1="365" y1="70" x2="365" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="365" y="62" text-anchor="middle" font-size="10" fill="#999" font-style="italic">now</text>

  <!-- AIPLA threshold (80%) -->
  <line x1="80" y1="140" x2="650" y2="140" stroke="#901a1e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="660" y="144" font-size="12" fill="#901a1e" font-weight="700">
    AIPLA threshold
  </text>
  <text x="660" y="158" font-size="10" fill="#901a1e">
    (≥80% for task T<tspan baseline-shift="sub" font-size="8">n</tspan>)
  </text>

  <!-- Frontier cloud line — Claude/GPT/Gemini Pro -->
  <polyline points="80,245 222,175 365,133 507,105 650,87"
            fill="none" stroke="#3a5a7a" stroke-width="2.5"/>
  <circle cx="80" cy="245" r="4" fill="#3a5a7a"/>
  <circle cx="222" cy="175" r="4" fill="#3a5a7a"/>
  <circle cx="365" cy="133" r="4" fill="#3a5a7a"/>
  <circle cx="507" cy="105" r="4" fill="#3a5a7a"/>
  <circle cx="650" cy="87" r="4" fill="#3a5a7a"/>

  <!-- Capable open-weight line — Llama 70B / Qwen 72B / Gemma -->
  <polyline points="80,315 222,252 365,192 507,147 650,115"
            fill="none" stroke="#2d7d3a" stroke-width="2.5"/>
  <circle cx="80" cy="315" r="4" fill="#2d7d3a"/>
  <circle cx="222" cy="252" r="4" fill="#2d7d3a"/>
  <circle cx="365" cy="192" r="4" fill="#2d7d3a"/>
  <circle cx="507" cy="147" r="4" fill="#2d7d3a"/>
  <circle cx="650" cy="115" r="4" fill="#2d7d3a"/>

  <!-- Small / on-device line — Phi/Gemma small/Apple Intelligence -->
  <polyline points="80,350 222,308 365,245 507,193 650,158"
            fill="none" stroke="#c2710c" stroke-width="2.5"/>
  <circle cx="80" cy="350" r="4" fill="#c2710c"/>
  <circle cx="222" cy="308" r="4" fill="#c2710c"/>
  <circle cx="365" cy="245" r="4" fill="#c2710c"/>
  <circle cx="507" cy="193" r="4" fill="#c2710c"/>
  <circle cx="650" cy="158" r="4" fill="#c2710c"/>

  <!-- Threshold crossing annotations -->
  <!-- Frontier crossed threshold ~2024 -->
  <circle cx="290" cy="140" r="6" fill="none" stroke="#3a5a7a" stroke-width="2"/>
  <text x="290" y="125" text-anchor="middle" font-size="10" fill="#3a5a7a" font-weight="600">
    crossed ~mid-2024
  </text>

  <!-- Open-weight crossing around 2026.5 -->
  <circle cx="530" cy="140" r="6" fill="none" stroke="#2d7d3a" stroke-width="2"/>
  <text x="555" y="125" font-size="10" fill="#2d7d3a" font-weight="600">
    crosses ~late 2026
  </text>

  <!-- Legend -->
  <rect x="100" y="350" width="200" height="62" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="110" y="368" font-size="11" font-weight="700" fill="#333">Model tier</text>

  <line x1="110" y1="380" x2="130" y2="380" stroke="#3a5a7a" stroke-width="2.5"/>
  <circle cx="120" cy="380" r="3" fill="#3a5a7a"/>
  <text x="135" y="384" font-size="11" fill="#333">Frontier cloud (Claude · Gemini Pro · GPT)</text>

  <line x1="110" y1="394" x2="130" y2="394" stroke="#2d7d3a" stroke-width="2.5"/>
  <circle cx="120" cy="394" r="3" fill="#2d7d3a"/>
  <text x="135" y="398" font-size="11" fill="#333">Capable open-weight (Llama / Qwen / Gemma)</text>

  <line x1="110" y1="406" x2="130" y2="406" stroke="#c2710c" stroke-width="2.5"/>
  <circle cx="120" cy="406" r="3" fill="#c2710c"/>
  <text x="135" y="410" font-size="11" fill="#333">Small / on-device (Phi · Apple Intelligence · Gemma Nano)</text>

</svg>
